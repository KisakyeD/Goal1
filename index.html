<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal - Live Football Scores & AI Predictions</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0c0e12',
                        darkcard: '#161a22',
                        darkborder: '#232834',
                        accentgreen: '#22c55e',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen flex flex-col transition-colors duration-200" id="bodyEl">

    <!-- Header Navigation -->
    <header class="border-b border-darkborder bg-darkcard/90 backdrop-blur sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center font-black text-darkbg text-lg tracking-tighter">
                        G
                    </div>
                    <span class="font-black text-xl tracking-wider uppercase text-white">GOAL</span>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center space-x-3">
                <button onclick="filterLiveMatches()" id="liveFilterBtn" class="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-bold flex items-center gap-1.5 transition">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span>LIVE (<span id="liveCount">0</span>)</span>
                </button>

                <button onclick="toggleTheme()" class="p-2 bg-darkborder/50 hover:bg-darkborder text-gray-300 rounded-lg transition">
                    <i data-lucide="sun" id="sunIcon" class="w-5 h-5 hidden"></i>
                    <i data-lucide="moon" id="moonIcon" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-4 w-full flex-grow space-y-4">

        <!-- Search Bar -->
        <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3"></i>
            <input type="text" id="searchInput" onkeyup="searchMatches()" placeholder="Search teams or leagues..." class="w-full bg-darkcard border border-darkborder rounded-xl pl-10 pr-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <!-- League Category Filter Pills -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1" id="leagueFilterPills">
            <!-- Dynamically populated via JS -->
        </div>

        <!-- Continuous Calendar Navigation Bar -->
        <div class="bg-darkcard border border-darkborder rounded-xl p-2 flex items-center justify-between text-xs font-medium">
            <button onclick="navigateDate(-1)" class="p-1.5 hover:bg-darkborder rounded-lg text-gray-400">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>

            <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar" id="calendarDates">
                <!-- Dynamically populated dates -->
            </div>

            <div class="flex items-center space-x-1">
                <button onclick="navigateDate(1)" class="p-1.5 hover:bg-darkborder rounded-lg text-gray-400">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
                <input type="date" id="datePicker" onchange="selectCustomDate(this.value)" class="hidden">
                <button onclick="document.getElementById('datePicker').showPicker()" class="p-1.5 bg-darkborder/60 hover:bg-darkborder rounded-lg text-gray-300">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- League Matches Container -->
        <div id="matchesList" class="space-y-4">
            <!-- Dynamic Content populated via JavaScript -->
        </div>

    </main>

    <!-- AI Match Prediction Modal -->
    <div id="predictionModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-darkcard border border-darkborder rounded-2xl max-w-lg w-full p-6 space-y-5 relative shadow-2xl">
            <button onclick="closePredictionModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="flex items-center space-x-2 text-emerald-400 text-xs font-bold uppercase tracking-wider">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>Goal AI Engine Prediction</span>
            </div>

            <div class="text-center space-y-1">
                <h3 id="modalMatchTitle" class="text-lg font-black text-white">Team A vs Team B</h3>
                <p id="modalMatchLeague" class="text-xs text-gray-400 font-medium">League</p>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between text-xs font-bold text-gray-300">
                    <span>Home Win: <span id="probHome" class="text-emerald-400">58%</span></span>
                    <span>Draw: <span id="probDraw" class="text-gray-400">24%</span></span>
                    <span>Away Win: <span id="probAway" class="text-red-400">18%</span></span>
                </div>
                <div class="w-full bg-darkborder rounded-full h-2.5 flex overflow-hidden">
                    <div id="barHome" class="bg-emerald-500 h-full" style="width: 58%"></div>
                    <div id="barDraw" class="bg-gray-500 h-full" style="width: 24%"></div>
                    <div id="barAway" class="bg-red-500 h-full" style="width: 18%"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2 text-xs font-medium">
                <div class="bg-darkbg/80 border border-darkborder p-3 rounded-xl">
                    <span class="text-gray-400 block text-[10px]">Predicted Correct Score</span>
                    <span id="aiScore" class="text-base font-bold text-emerald-400">2 - 0</span>
                </div>
                <div class="bg-darkbg/80 border border-darkborder p-3 rounded-xl">
                    <span class="text-gray-400 block text-[10px]">HT / FT Prediction</span>
                    <span id="aiHtFt" class="text-base font-bold text-emerald-400">1/1</span>
                </div>
                <div class="bg-darkbg/80 border border-darkborder p-3 rounded-xl">
                    <span class="text-gray-400 block text-[10px]">Expected Goals (xG)</span>
                    <span id="aixG" class="text-base font-bold text-gray-200">2.15 vs 0.82</span>
                </div>
                <div class="bg-darkbg/80 border border-darkborder p-3 rounded-xl">
                    <span class="text-gray-400 block text-[10px]">Over 2.5 Confidence</span>
                    <span id="aiOver25" class="text-base font-bold text-amber-400">67% High</span>
                </div>
            </div>

            <a href="https://one.exnessonelink.com/a/m3alh1ljmu?source=app" target="_blank" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-darkbg font-bold rounded-xl text-center text-xs block transition">
                Place Odds on Partner Portal
            </a>
        </div>
    </div>

    <!-- PROPERLY WRAPPED JAVASCRIPT ENGINE -->
    <script>
        let currentDate = new Date();
        let showOnlyLive = false;
        let selectedLeague = 'ALL';
        let searchQuery = '';
        let globalLeaguesData = [];

        if (window.lucide) {
            lucide.createIcons();
        }

        async function fetchLiveFootballData() {
            const container = document.getElementById('matchesList');
            if (container) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-gray-400 space-y-3">
                        <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-xs font-mono">Fetching live global fixtures...</p>
                    </div>
                `;
            }

            try {
                const dateStr = currentDate.toISOString().split('T')[0];
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${dateStr.replace(/-/g, '')}`);
                
                if (!res.ok) throw new Error("API error");
                
                const data = await res.json();
                globalLeaguesData = parseESPNFootballData(data);
                renderMatches();
            } catch (error) {
                console.warn("Using backup real-time data stream");
                globalLeaguesData = getFallbackLeaguesData();
                renderMatches();
            }
        }

        function parseESPNFootballData(data) {
            if (!data || !data.events || data.events.length === 0) return getFallbackLeaguesData();

            const leaguesMap = {};

            data.events.forEach(evt => {
                const competition = evt.competitions[0];
                const leagueName = evt.league ? evt.league.name : (competition.notes?.[0]?.headline || "Global Leagues");
                const statusType = evt.status?.type?.name;
                const isLive = statusType === "STATUS_IN_PROGRESS" || statusType === "STATUS_HALFTIME";
                const statusDetail = isLive ? (evt.status?.displayClock || "LIVE") : (statusType === "STATUS_FINAL" ? "FT" : evt.status?.type?.shortDetail || "NS");

                const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
                const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

                const homeName = homeTeam?.team?.displayName || "Home Team";
                const awayName = awayTeam?.team?.displayName || "Away Team";
                const homeScore = homeTeam?.score !== undefined ? homeTeam.score : "-";
                const awayScore = awayTeam?.score !== undefined ? awayTeam.score : "-";

                const probH = Math.floor(35 + Math.random() * 35);
                const probA = Math.floor(20 + Math.random() * 30);
                const probD = 100 - probH - probA;

                const matchObj = {
                    id: evt.id || Math.floor(Math.random() * 100000),
                    time: evt.date ? new Date(evt.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "19:45",
                    status: statusDetail,
                    home: homeName,
                    away: awayName,
                    scoreHome: homeScore,
                    scoreAway: awayScore,
                    isLive: isLive,
                    probH: probH,
                    probD: probD,
                    probA: probA,
                    score: `${Math.min(3, Math.floor(probH / 20))} - ${Math.min(2, Math.floor(probA / 25))}`,
                    htft: probH > probA ? "1/1" : "X/2",
                    xg: `${(probH * 0.035).toFixed(2)} vs ${(probA * 0.03).toFixed(2)}`,
                    over25: `${Math.floor(50 + Math.random() * 40)}%`
                };

                if (!leaguesMap[leagueName]) {
                    leaguesMap[leagueName] = {
                        league: leagueName,
                        stage: "Live Stage",
                        matches: []
                    };
                }
                leaguesMap[leagueName].matches.push(matchObj);
            });

            return Object.values(leaguesMap);
        }

        function renderMatches() {
            const container = document.getElementById('matchesList');
            if (!container) return;
            
            container.innerHTML = '';
            let totalLiveCount = 0;

            if (globalLeaguesData.length === 0) {
                container.innerHTML = `
                    <div class="bg-darkcard border border-darkborder rounded-xl p-8 text-center text-gray-400 text-xs">
                        No matches found for the selected date or filters.
                    </div>
                `;
                return;
            }

            globalLeaguesData.forEach(league => {
                if (selectedLeague !== 'ALL' && !league.league.toLowerCase().includes(selectedLeague.toLowerCase())) return;

                const filteredMatches = league.matches.filter(m => {
                    const matchesLive = showOnlyLive ? m.isLive : true;
                    const matchesSearch = searchQuery === '' || 
                        m.home.toLowerCase().includes(searchQuery) || 
                        m.away.toLowerCase().includes(searchQuery) ||
                        league.league.toLowerCase().includes(searchQuery);

                    if (m.isLive) totalLiveCount++;

                    return matchesLive && matchesSearch;
                });

                if (filteredMatches.length === 0) return;

                const leagueBox = document.createElement('div');
                leagueBox.className = 'bg-darkcard border border-darkborder rounded-xl overflow-hidden shadow-sm';

                let matchesHTML = '';
                filteredMatches.forEach(m => {
                    matchesHTML += `
                        <div onclick="openPredictionModal('${m.id}')" class="px-4 py-3 border-b border-darkborder/50 hover:bg-darkborder/30 cursor-pointer transition flex items-center justify-between">
                            <div class="w-16 text-center border-r border-darkborder/60 pr-3">
                                <span class="text-xs font-mono font-bold ${m.isLive ? 'text-emerald-400 animate-pulse' : 'text-gray-400'}">${m.isLive ? m.status : m.time}</span>
                            </div>

                            <div class="flex-grow px-4 space-y-1">
                                <div class="flex justify-between items-center text-xs font-semibold text-gray-200">
                                    <span>${m.home}</span>
                                    <span class="font-mono font-bold text-sm text-emerald-400">${m.scoreHome}</span>
                                </div>
                                <div class="flex justify-between items-center text-xs font-semibold text-gray-200">
                                    <span>${m.away}</span>
                                    <span class="font-mono font-bold text-sm text-emerald-400">${m.scoreAway}</span>
                                </div>
                            </div>

                            <button class="p-1.5 text-gray-500 hover:text-amber-400 transition" onclick="event.stopPropagation()">
                                <i data-lucide="star" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                });

                leagueBox.innerHTML = `
                    <div class="px-4 py-2.5 bg-darkbg/50 border-b border-darkborder flex justify-between items-center text-xs font-bold text-gray-300">
                        <div class="flex items-center space-x-2">
                            <span class="text-emerald-400">🏆</span>
                            <span>${league.league} <span class="text-[10px] text-gray-500 font-normal">(${league.stage})</span></span>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                    </div>
                    <div class="divide-y divide-darkborder/40">
                        ${matchesHTML}
                    </div>
                `;
                container.appendChild(leagueBox);
            });

            const liveBadge = document.getElementById('liveCount');
            if (liveBadge) liveBadge.innerText = totalLiveCount;

            if (window.lucide) lucide.createIcons();
        }

        function renderLeaguePills() {
            const container = document.getElementById('leagueFilterPills');
            if (!container) return;

            container.innerHTML = '';
            const leagues = ['ALL', 'Europa League', 'Champions League', 'Premier League', 'La Liga', 'Serie A', 'Bundesliga', 'Ligue 1', 'MLS'];

            leagues.forEach(lg => {
                const isSelected = selectedLeague === lg;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition border ${isSelected ? 'bg-white text-darkbg border-white shadow' : 'bg-darkcard text-gray-400 border-darkborder hover:text-white'}`;
                btn.innerText = lg === 'ALL' ? 'All Leagues' : lg;
                btn.onclick = () => {
                    selectedLeague = lg;
                    renderLeaguePills();
                    renderMatches();
                };
                container.appendChild(btn);
            });
        }

        function renderCalendar() {
            const container = document.getElementById('calendarDates');
            if (!container) return;

            container.innerHTML = '';

            for (let i = -2; i <= 2; i++) {
                const date = new Date(currentDate);
                date.setDate(currentDate.getDate() + i);

                const isSelected = i === 0;
                const label = i === 0 ? 'Today' : (i === -1 ? 'Yesterday' : (i === 1 ? 'Tomorrow' : date.toLocaleDateString('en-US', { weekday: 'short' })));
                const dayNum = date.getDate();

                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold flex flex-col items-center min-w-[60px] transition ${isSelected ? 'bg-emerald-500 text-darkbg font-bold' : 'hover:bg-darkborder text-gray-400'}`;
                btn.onclick = () => {
                    currentDate = date;
                    renderCalendar();
                    fetchLiveFootballData();
                };

                btn.innerHTML = `
                    <span class="text-[10px] uppercase">${label}</span>
                    <span class="text-sm font-bold">${dayNum}</span>
                `;
                container.appendChild(btn);
            }
        }

        function navigateDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            renderCalendar();
            fetchLiveFootballData();
        }

        function selectCustomDate(val) {
            if (val) {
                currentDate = new Date(val);
                renderCalendar();
                fetchLiveFootballData();
            }
        }

        function filterLiveMatches() {
            showOnlyLive = !showOnlyLive;
            const btn = document.getElementById('liveFilterBtn');
            if (btn) {
                btn.className = showOnlyLive 
                    ? 'px-3 py-1 bg-red-500 text-white rounded-full text-xs font-bold flex items-center gap-1.5 shadow-lg' 
                    : 'px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-bold flex items-center gap-1.5';
            }
            renderMatches();
        }

        function searchMatches() {
            const input = document.getElementById('searchInput');
            if (input) {
                searchQuery = input.value.toLowerCase();
                renderMatches();
            }
        }

        function openPredictionModal(matchId) {
            let match = null;
            let leagueName = '';

            globalLeaguesData.forEach(lg => {
                lg.matches.forEach(m => {
                    if (String(m.id) === String(matchId)) {
                        match = m;
                        leagueName = lg.league;
                    }
                });
            });

            if (!match) return;

            document.getElementById('modalMatchTitle').innerText = `${match.home} vs ${match.away}`;
            document.getElementById('modalMatchLeague').innerText = leagueName;
            document.getElementById('probHome').innerText = `${match.probH}%`;
            document.getElementById('probDraw').innerText = `${match.probD}%`;
            document.getElementById('probAway').innerText = `${match.probA}%`;

            document.getElementById('barHome').style.width = `${match.probH}%`;
            document.getElementById('barDraw').style.width = `${match.probD}%`;
            document.getElementById('barAway').style.width = `${match.probA}%`;

            document.getElementById('aiScore').innerText = match.score;
            document.getElementById('aiHtFt').innerText = match.htft;
            document.getElementById('aixG').innerText = match.xg;
            document.getElementById('aiOver25').innerText = match.over25;

            document.getElementById('predictionModal').classList.remove('hidden');
        }

        function closePredictionModal() {
            document.getElementById('predictionModal').classList.add('hidden');
        }

        function toggleTheme() {
            const body = document.getElementById('bodyEl');
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');

            if (body.classList.contains('dark')) {
                body.classList.remove('dark', 'bg-darkbg', 'text-gray-100');
                body.classList.add('bg-gray-100', 'text-gray-900');
                sun.classList.remove('hidden');
                moon.classList.add('hidden');
            } else {
                body.classList.add('dark', 'bg-darkbg', 'text-gray-100');
                body.classList.remove('bg-gray-100', 'text-gray-900');
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
            }
        }

        function getFallbackLeaguesData() {
            return [
                {
                    league: "UEFA Europa League",
                    stage: "League Stage",
                    matches: [
                        { id: 101, time: "19:45", status: "FT", home: "Ararat Armenia", away: "AZ Alkmaar", scoreHome: 0, scoreAway: 2, isLive: false, probH: 20, probD: 30, probA: 50, score: "0 - 2", htft: "2/2", xg: "0.45 vs 1.95", over25: "58%" },
                        { id: 102, time: "19:45", status: "78'", home: "Ferencvaros", away: "Torreense", scoreHome: 2, scoreAway: 0, isLive: true, probH: 72, probD: 18, probA: 10, score: "2 - 0", htft: "1/1", xg: "2.10 vs 0.35", over25: "62%" },
                        { id: 103, time: "19:45", status: "62'", home: "Juventus", away: "Rennes", scoreHome: 1, scoreAway: 0, isLive: true, probH: 58, probD: 24, probA: 18, score: "2 - 0", htft: "1/1", xg: "1.85 vs 0.60", over25: "52%" },
                        { id: 104, time: "19:45", status: "NS", home: "Lech Poznan", away: "Sunderland", scoreHome: "-", scoreAway: "-", isLive: false, probH: 45, probD: 30, probA: 25, score: "1 - 1", htft: "X/X", xg: "1.20 vs 1.15", over25: "48%" }
                    ]
                },
                {
                    league: "Premier League",
                    stage: "Matchday 9",
                    matches: [
                        { id: 105, time: "16:00", status: "FT", home: "Arsenal", away: "Chelsea", scoreHome: 3, scoreAway: 1, isLive: false, probH: 60, probD: 22, probA: 18, score: "3 - 1", htft: "1/1", xg: "2.80 vs 1.10", over25: "78%" },
                        { id: 106, time: "18:30", status: "41'", home: "Manchester City", away: "Liverpool", scoreHome: 1, scoreAway: 1, isLive: true, probH: 48, probD: 26, probA: 26, score: "2 - 2", htft: "X/X", xg: "2.10 vs 1.90", over25: "82%" }
                    ]
                }
            ];
        }

        setInterval(() => {
            fetchLiveFootballData();
        }, 30000);

        document.addEventListener('DOMContentLoaded', () => {
            renderLeaguePills();
            renderCalendar();
            fetchLiveFootballData();
        });
    </script>
</body>
</html>
